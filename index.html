<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="Matel — a lightweight JavaScript 3D engine for mobile web games.">
  <title>Matel 3D Engine — Live Demo</title>  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b1020;
      color: #eef2ff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    header {
      padding: 22px 20px 14px;
      text-align: center;
    }

    .logo {
      margin: 0;
      font-size: clamp(30px, 7vw, 48px);
      font-weight: 850;
      letter-spacing: -2px;
    }

    .logo span {
      color: #55b9ff;
    }

    .subtitle {
      margin: 8px auto 0;
      max-width: 600px;
      color: #aab7d4;
      line-height: 1.5;
    }

    main {
      width: min(1100px, 100%);
      margin: auto;
      padding: 14px;
    }

    .viewport {
      position: relative;
      overflow: hidden;
      border: 1px solid #263656;
      border-radius: 18px;
      background: #10182b;
      box-shadow: 0 18px 60px #0005;
    }

    #view {
      display: block;
      width: 100%;
      height: min(62vh, 560px);
      min-height: 320px;
      touch-action: none;
    }

    .hint {
      padding: 12px 15px;
      color: #aab7d4;
      font-size: 13px;
      text-align: center;
      border-top: 1px solid #263656;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .stat {
      padding: 15px;
      border: 1px solid #263656;
      border-radius: 13px;
      background: #111a2e;
      min-width: 0;
    }

    .stat-label {
      color: #9baaca;
      font-size: 12px;
    }

    .stat-value {
      margin-top: 6px;
      font-size: clamp(17px, 4vw, 24px);
      font-weight: 750;
      overflow-wrap: anywhere;
    }

    .panel {
      margin-top: 14px;
      padding: 18px;
      border: 1px solid #263656;
      border-radius: 13px;
      background: #111a2e;
    }

    .panel h2 {
      margin: 0 0 10px;
      font-size: 18px;
    }

    #status {
      color: #9baaca;
      font-size: 14px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .status-ok {
      color: #79e6b0 !important;
    }

    .status-error {
      color: #ff8c9b !important;
    }

    footer {
      padding: 25px 16px;
      text-align: center;
      color: #7584a5;
      font-size: 13px;
    }

    footer a {
      color: #55b9ff;
      text-decoration: none;
    }

    @media (max-width: 480px) {
      header {
        padding-top: 18px;
      }

      main {
        padding: 10px;
      }

      .stat {
        padding: 11px;
      }

      #view {
        min-height: 300px;
      }
    }
  </style></head><body>
  <header>
    <h1 class="logo">M<span>atel</span></h1>
    <p class="subtitle">
      A lightweight JavaScript 3D engine for mobile web games.
      Pure Canvas 2D software rendering.
    </p>
  </header>  <main>
    <section class="viewport">
      <canvas id="view"></canvas>
      <div class="hint">
        Drag to rotate · Pinch or scroll to zoom · Try it on mobile
      </div>
    </section><section class="stats">
  <div class="stat">
    <div class="stat-label">FPS</div>
    <div class="stat-value" id="fps">—</div>
  </div>

  <div class="stat">
    <div class="stat-label">Triangles</div>
    <div class="stat-value" id="triangles">—</div>
  </div>

  <div class="stat">
    <div class="stat-label">Resolution</div>
    <div class="stat-value" id="resolution">—</div>
  </div>
</section>

<section class="panel">
  <h2>Engine status</h2>
  <div id="status">Initializing Matel...</div>
</section>

  </main>  <footer>
    Matel 3D Engine · v0.1.0 · MIT License
    <br>
    <a href="https://github.com/dogday-hazker/Matel">
      View source on GitHub
    </a>
  </footer>  <script type="module">
    const status = document.getElementById("status");
    const fpsElement = document.getElementById("fps");
    const trianglesElement = document.getElementById("triangles");
    const resolutionElement = document.getElementById("resolution");

    function showError(error) {
      status.className = "status-error";
      status.textContent =
        "Engine failed to start: " +
        (error?.message || String(error)) +
        ". Check the source files and browser console.";
      console.error("Matel startup error:", error);
    }

    try {
      const { default: Matel } = await import("./src/index.js");

      const engine = new Matel({
        canvas: "#view",
        background: [0.04, 0.05, 0.10],
        resolutionScale: 0.75,
        maxPixels: 500000,
        adaptive: true,
        targetFps: 60
      });

      engine.addCube({
        size: 1.5,
        color: [0.15, 0.65, 1],
        rotation: [0.4, 0.5, 0]
      });

      engine.addSphere({
        radius: 0.65,
        segments: 16,
        color: [1, 0.35, 0.2],
        position: [2, 0, 0]
      });

      engine.addPlane({
        size: 8,
        color: [0.25, 0.3, 0.4],
        position: [0, -1.2, 0]
      });

      engine.enableOrbitControls({
        target: [0.5, 0, 0],
        distance: 6
      });

      engine.onUpdate((dt) => {
        if (engine.objects?.[0]?.rotation) {
          engine.objects[0].rotation[1] += dt * 0.5;
        }
      });

      engine.start();

      status.className = "status-ok";
      status.textContent = "Matel initialized. Waiting for rendering statistics...";

      window.setInterval(() => {
        const stats = engine.stats || {};

        fpsElement.textContent =
          Number.isFinite(stats.fps) ? Math.round(stats.fps) : "—";

        trianglesElement.textContent =
          Number.isFinite(stats.triangles) ? stats.triangles : "—";

        resolutionElement.textContent =
          stats.width && stats.height
            ? `${stats.width} × ${stats.height}`
            : "—";

        status.textContent = "Engine started. Interact with the 3D scene above.";
      }, 500);
    } catch (error) {
      showError(error);
    }
  </script></body>
</html>
